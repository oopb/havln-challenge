name: Codex MCP navigation smoke contracts

on:
  pull_request:
    paths:
      - "havln_agent/codex_episode.py"
      - "havln_agent/competition_scoring.py"
      - "havln_agent/simulator_evaluation.py"
      - "havln_agent/scoring_data/**"
      - "tests/test_competition_scoring.py"
      - "tests/test_simulator_evaluation.py"
      - "havln_agent/pillow_compat.py"
      - "havln_agent/perception.py"
      - "tests/test_forward_body_risk.py"
      - "havln_agent/codex_usage.py"
      - "havln_agent/codex_batch.py"
      - "havln_agent/codex_mcp.py"
      - "scripts/havln_mcp_server.py"
      - "scripts/run_codex_episode.py"
      - "scripts/run_codex_batch.py"
      - "tests/test_codex_navigation.py"
      - "tests/test_codex_usage.py"
      - "tests/test_codex_batch.py"
      - "havln_agent/replay_server.py"
      - "scripts/pack_agent_diagnostics.py"
      - "replay_ui/**"
      - ".github/workflows/codex-navigation-check.yml"
  workflow_dispatch:

jobs:
  codex-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight offline dependencies
        run: python -m pip install "numpy<3" "Pillow<12" "jsonschema>=4.17,<5" "PyYAML>=6,<7"
      - name: Compile independent Codex path
        run: python -m compileall -q havln_agent/pillow_compat.py havln_agent/perception.py havln_agent/codex_episode.py havln_agent/codex_mcp.py havln_agent/codex_usage.py havln_agent/codex_batch.py scripts/havln_mcp_server.py scripts/run_codex_episode.py scripts/run_codex_batch.py scripts/pack_agent_diagnostics.py havln_agent/replay_server.py tests/test_codex_navigation.py tests/test_codex_usage.py tests/test_codex_batch.py
      - name: Test MCP wire, replay receipts and session isolation
        run: python -m unittest discover -s tests -p 'test_codex_navigation.py' -v
      - name: Test full-body public Depth observation geometry
        run: python -m unittest discover -s tests -p 'test_forward_body_risk.py' -v
      - name: Test Codex token and quota accounting
        run: python -m unittest discover -s tests -p 'test_codex_usage.py' -v
      - name: Test independent Codex batch scheduler and lossless ZIP playback
        run: python -m unittest discover -s tests -p 'test_codex_batch.py' -v
      - name: Test validation scoring reconstruction and proof isolation
        run: python -m unittest discover -s tests -p 'test_competition_scoring.py' -v
      - name: Test Habitat metric capture and published allowance fallback
        run: python -m unittest discover -s tests -p 'test_simulator_evaluation.py' -v
      - name: Validate existing replay studio compatibility
        run: python -m unittest discover -s tests -p 'test_replay_studio.py' -v
      - name: Validate replay frontend syntax
        run: node --check replay_ui/app.js

  codex-python38-import:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install controller and legacy Pillow dependencies
        run: python -m pip install "numpy>=1.20,<1.25" "Pillow==8.4.0" "jsonschema>=4.17,<5" "PyYAML>=6,<7"
      - name: Assert legacy Pillow lacks Image.Resampling
        run: python -c "from PIL import Image; assert not hasattr(Image, 'Resampling'); print('Legacy Pillow runtime confirmed')"
      - name: Import restored Codex MCP controller
        run: python -c "from havln_agent.codex_episode import CodexEpisode; from havln_agent.codex_mcp import MCPServer; print('Codex MCP controller import OK')"
      - name: Test side-Depth geometry under legacy Pillow
        run: python -m unittest discover -s tests -p 'test_forward_body_risk.py' -v
      - name: Test baseline MCP navigation and action receipts under legacy Pillow
        run: python -m unittest discover -s tests -p 'test_codex_navigation.py' -v
