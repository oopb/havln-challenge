name: HA-VLN mission navigation contract regression

on:
  pull_request:
    paths:
      - "havln_agent/**"
      - "configs/agent.yaml"
      - "tests/test_mission_navigation_architecture.py"
      - "tests/test_mission_history_and_headings.py"
      - ".github/workflows/planner-regression.yml"
  workflow_dispatch:

jobs:
  mission-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight runtime dependencies
        run: python -m pip install "numpy<3" "Pillow<12" "jsonschema>=4.17,<5" "PyYAML>=6,<7"
      - name: Compile all agent modules
        run: python -m compileall -q havln_agent
      - name: Verify whole-instruction navigation, evidence Memory and RGB-D observation contracts
        run: python -m unittest discover -s tests -p 'test_mission_navigation_architecture.py' -v
      - name: Verify canonical heading, session identity and cross-agent evidence consistency
        run: python -m unittest discover -s tests -p 'test_mission_history_and_headings.py' -v
      - name: Verify RGB-D feature-registration math
        run: python -m unittest discover -s tests -p 'test_motion_consensus.py' -v
