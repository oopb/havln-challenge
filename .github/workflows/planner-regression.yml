name: HA-VLN planner contract regression

on:
  pull_request:
    paths:
      - "havln_agent/**"
      - "tests/test_task_planner_contract.py"
      - "tests/test_runtime_perf.py"
      - "tests/test_navigation_loop.py"
      - "tests/test_role_prompt_contracts.py"
      - "tests/test_smoke50012_feedback.py"
      - "tests/test_terminal_progress.py"
      - "tests/test_smoke50013_waypoints.py"
      - "tests/test_active_observation.py"
      - ".github/workflows/planner-regression.yml"
  workflow_dispatch:

jobs:
  planner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight runtime dependencies
        run: python -m pip install "numpy<3" "Pillow<12" "jsonschema>=4.17,<5"
      - name: Run planner contract regression
        run: python -m unittest discover -s tests -p 'test_task_planner_contract.py' -v
      - name: Run runtime performance regression
        run: python -m unittest discover -s tests -p 'test_runtime_perf.py' -v
      - name: Run navigation loop regression
        run: python -m unittest discover -s tests -p 'test_navigation_loop.py' -v
      - name: Check role prompt contracts
        run: python -m unittest discover -s tests -p 'test_role_prompt_contracts.py' -v
      - name: Check measured collision and repeated-view regressions
        run: python -m unittest discover -s tests -p 'test_smoke50012_feedback.py' -v
      - name: Check live terminal monitor
        run: python -m unittest discover -s tests -p 'test_terminal_progress.py' -v
      - name: Check smoke-500-13 view-only waypoint guard
        run: python -m unittest discover -s tests -p 'test_smoke50013_waypoints.py' -v
      - name: Check active observation subtasks
        run: python -m unittest discover -s tests -p 'test_active_observation.py' -v
