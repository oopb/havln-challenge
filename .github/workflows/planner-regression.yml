name: HA-VLN planner contract regression

on:
  pull_request:
    paths:
      - "havln_agent/**"
      - "tests/test_task_planner_contract.py"
      - "tests/test_runtime_perf.py"
      - "tests/test_navigation_loop.py"
      - "tests/test_role_prompt_contracts.py"
      - "tests/test_smoke50012_feedback.py"
      - "tests/test_terminal_progress.py"
      - "tests/test_smoke50013_waypoints.py"
      - "tests/test_active_observation.py"
      - "tests/test_odometry_gap_navigation.py"
      - "tests/test_motion_consensus.py"
      - "tests/test_compact_diagnostics.py"
      - "tests/test_observe_move_cycle.py"
      - "tests/test_auto_archive.py"
      - "tests/test_on_demand_geometry.py"
      - "tests/test_fast_probe_runtime.py"
      - "tests/test_observation_efficiency.py"
      - "tests/test_model_driven_direction.py"
      - "havln_agent/export.py"
      - "tests/test_local_exploration.py"
      - "tests/test_scheduler_liveness.py"
      - "tests/test_runtime_config_liveness.py"
      - "scripts/pack_agent_diagnostics.py"
      - ".github/workflows/planner-regression.yml"
  workflow_dispatch:

jobs:
  planner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight runtime dependencies
        run: python -m pip install "numpy<3" "Pillow<12" "jsonschema>=4.17,<5" "PyYAML>=6,<7"
      - name: Run planner contract regression
        run: python -m unittest discover -s tests -p 'test_task_planner_contract.py' -v
      - name: Run runtime performance regression
        run: python -m unittest discover -s tests -p 'test_runtime_perf.py' -v
      - name: Run navigation loop regression
        run: python -m unittest discover -s tests -p 'test_navigation_loop.py' -v
      - name: Check role prompt contracts
        run: python -m unittest discover -s tests -p 'test_role_prompt_contracts.py' -v
      - name: Check measured collision and repeated-view regressions
        run: python -m unittest discover -s tests -p 'test_smoke50012_feedback.py' -v
      - name: Check live terminal monitor
        run: python -m unittest discover -s tests -p 'test_terminal_progress.py' -v
      - name: Check smoke-500-13 view-only waypoint guard
        run: python -m unittest discover -s tests -p 'test_smoke50013_waypoints.py' -v
      - name: Check active observation subtasks
        run: python -m unittest discover -s tests -p 'test_active_observation.py' -v
      - name: Check bounded navigation after uncertain RGB-D motion
        run: python -m unittest discover -s tests -p 'test_odometry_gap_navigation.py' -v
      - name: Check distributed static RGB-D motion consensus
        run: python -m unittest discover -s tests -p 'test_motion_consensus.py' -v
      - name: Check compact diagnostic packaging
        run: python -m unittest discover -s tests -p 'test_compact_diagnostics.py' -v
      - name: Check OBSERVE/MOVE cycle and memory
        run: python -m unittest discover -s tests -p 'test_observe_move_cycle.py' -v
      - name: Check automatic diagnostic archive
        run: python -m unittest discover -s tests -p 'test_auto_archive.py' -v
      - name: Check on-demand geometry and fast depth movement
        run: python -m unittest discover -s tests -p 'test_on_demand_geometry.py' -v
      - name: Check real geometry and one-shot forward probe
        run: python -m unittest discover -s tests -p 'test_fast_probe_runtime.py' -v
      - name: Check observe efficiency and target-aware candidate ranking
        run: python -m unittest discover -s tests -p 'test_observation_efficiency.py' -v
      - name: Check model-directed motion with partial landmark evidence
        run: python -m unittest discover -s tests -p 'test_model_driven_direction.py' -v
      - name: Check post-block local exploration and scan deduplication
        run: python -m unittest discover -s tests -p 'test_local_exploration.py' -v
      - name: Check evidence-state liveness and bounded API decisions
        run: python -m unittest discover -s tests -p 'test_scheduler_liveness.py' -v
      - name: Check shipped agent.yaml liveness configuration compatibility
        run: python -m unittest discover -s tests -p 'test_runtime_config_liveness.py' -v
