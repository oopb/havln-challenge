name: HA-VLN mission navigation contract regression

on:
  pull_request:
    paths:
      - "havln_agent/**"
      - "configs/agent.yaml"
      - "tests/test_adaptive_reasoning.py"
      - "tests/test_mission_navigation_architecture.py"
      - "tests/test_mission_history_and_headings.py"
      - "tests/test_forward_preflight_v9.py"
      - "tests/test_recoverable_camera_pitch.py"
      - "tests/test_navigation_blocked_history_contract.py"
      - "tests/test_v11_observation_review.py"
      - "tests/test_v12_action_stance.py"
      - "tests/test_v13_navigation_context.py"
      - "tests/test_v16_observation_continuity.py"
      - "tests/test_v20_direction_depth.py"
      - "tests/test_v21_compact_navigation_context.py"
      - "tests/test_v22_active_pitch_heading.py"
      - "tests/test_v23_route_evidence.py"
      - "tests/test_v26_eval39_route_quality.py"
      - "tests/test_v27_model_relative_angles.py"
      - "tests/test_v28_grounded_decisions.py"
      - "tests/test_replay_studio.py"
      - "tests/test_competition_scoring.py"
      - "replay_ui/**"
      - "scripts/serve_agent_replay.py"
      - "scripts/pack_agent_diagnostics.py"
      - ".github/workflows/planner-regression.yml"
  workflow_dispatch:

jobs:
  mission-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight runtime dependencies
        run: python -m pip install "numpy<3" "Pillow<12" "jsonschema>=4.17,<5" "PyYAML>=6,<7"
      - name: Capture replay self-test diagnostics
        run: |
          python -m unittest discover -s tests -p 'test_replay_studio.py' -v > replay-test-output.log 2>&1 || echo "Replay tests failed" >> replay-test-output.log
          cat replay-test-output.log
      - name: Upload replay self-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-test-log
          path: replay-test-output.log
          if-no-files-found: ignore
      - name: Compile all agent modules
        run: python -m compileall -q havln_agent
      - name: Verify reasoning effort compatibility and safe protocol negotiation
        run: python -m unittest discover -s tests -p 'test_adaptive_reasoning.py' -v
      - name: Verify whole-instruction navigation, evidence Memory and RGB-D observation contracts
        run: python -m unittest discover -s tests -p 'test_mission_navigation_architecture.py' -v
      - name: Verify canonical heading, session identity and cross-agent evidence consistency
        run: python -m unittest discover -s tests -p 'test_mission_history_and_headings.py' -v
      - name: Verify pre-decision Depth, camera alignment and repeated stall evidence
        run: python -m unittest discover -s tests -p 'test_forward_preflight_v9.py' -v
      - name: Verify stable LOOK schema, recoverable pitch boundaries and scheduler continuation
        run: python -m unittest discover -s tests -p 'test_recoverable_camera_pitch.py' -v
      - name: Verify real navigation inference after measured Depth block (eval-batch4-25)
        run: python -m unittest discover -s tests -p 'test_navigation_blocked_history_contract.py' -v
      - name: Verify v11 VLM JSON integrity, cross-session view memory and real RGB-D conversation input audit
        run: python -m unittest discover -s tests -p 'test_v11_observation_review.py' -v
      - name: Verify v12 no-VO forward receipts, stance reuse, historical invalidation and Depth veto
        run: python -m unittest discover -s tests -p 'test_v12_action_stance.py' -v
      - name: Verify internal causal memory, v14 compact navigator context, sourced history RGB and direction contract
        run: python -m unittest discover -s tests -p 'test_v13_navigation_context.py' -v
      - name: Verify v16 full scan coverage, source-bound route memory and cross-session VLM reuse
        run: python -m unittest discover -s tests -p 'test_v16_observation_continuity.py' -v
      - name: Verify retained PR 90 direction words and conclusive-only Depth
        run: python -m unittest discover -s tests -p 'test_v20_direction_depth.py' -v
      - name: Verify retained PR 91 compact canonical Memory projection and scan telemetry
        run: python -m unittest discover -s tests -p 'test_v21_compact_navigation_context.py' -v
      - name: Verify relative-only navigation actions and active camera pitch
        run: python -m unittest discover -s tests -p 'test_v22_active_pitch_heading.py' -v
      - name: Verify v23 historical route anchors, conflicting claims, pitch novelty and photo selection
        run: python -m unittest discover -s tests -p 'test_v23_route_evidence.py' -v
      - name: Verify eval-39 forward-then-endpoint-block, source-image diversity and relative turn evidence
        run: python -m unittest discover -s tests -p 'test_v26_eval39_route_quality.py' -v
      - name: Verify v27 model-facing camera-relative angles and VLM session rebase
        run: python -m unittest discover -s tests -p 'test_v27_model_relative_angles.py' -v
      - name: Verify eval-41 same-RGBD rejected forward feedback and selective stair observation
        run: python -m unittest discover -s tests -p 'test_v28_grounded_decisions.py' -v
      - name: Verify replay capture, deduplicated images, timeline and ZIP compatibility
        run: python -m unittest discover -s tests -p 'test_replay_studio.py' -v
      - name: Verify official Track 2 formula, adjusted collision metrics and missing-score semantics
        run: python -m unittest discover -s tests -p 'test_competition_scoring.py' -v
      - name: Verify replay frontend JavaScript syntax
        run: node --check replay_ui/app.js
      - name: Verify independent OFFLINE RGB-D feature-registration math
        run: python -m unittest discover -s tests -p 'test_motion_consensus.py' -v
